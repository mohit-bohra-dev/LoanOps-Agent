<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Documentation — Servicing Agent</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f9fafb;
      color: #111827;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      text-align: center;
      max-width: 600px;
    }
    h1 { font-size: 2.5rem; margin-bottom: 1rem; color: #1f2937; }
    p { font-size: 1.125rem; color: #6b7280; margin-bottom: 2rem; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }
    .card {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid #e5e7eb;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
      border-color: #3b82f6;
    }
    .card h2 { font-size: 1.25rem; margin: 0 0 0.5rem 0; color: #111827; }
    .card p { font-size: 0.875rem; margin: 0 0 1rem 0; color: #6b7280; }
    .links { display: flex; gap: 1rem; justify-content: center; }
    .links a {
      font-size: 0.875rem;
      color: #3b82f6;
      text-decoration: none;
      font-weight: 600;
      padding: 0.5rem 1rem;
      border: 1px solid #3b82f6;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .links a:hover {
      background: #3b82f6;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Developer Portal</h1>
    <p>Comprehensive API specifications for the Servicing Agent ecosystem.</p>
    <div class="grid">
      <div class="card">
        <h2>Agent API</h2>
        <p>Streaming chat and orchestration endpoints.</p>
        <div class="links">
          <a href="agent.html">Read Docs (ReDoc)</a>
          <a href="agent-swagger.html">Test API (Swagger)</a>
        </div>
      </div>
      <div class="card">
        <h2>Tools API</h2>
        <p>Mortgage servicing mock data endpoints.</p>
        <div class="links">
          <a href="tools.html">Read Docs (ReDoc)</a>
          <a href="tools-swagger.html">Test API (Swagger)</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
