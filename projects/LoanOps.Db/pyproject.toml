[project]
name = "loanops-db"
version = "0.1.0"
description = "LoanOps read-only SQL Server client"
requires-python = ">=3.11,<3.13"
dependencies = [
    "aioodbc>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["packages/db"]

[tool.hatch.build.targets.wheel.force-include]
"packages/db" = "packages/db"
