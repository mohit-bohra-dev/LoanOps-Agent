[project]
name = "loanops-capability-kg"
version = "0.1.0"
description = "LoanOps RDF capability ontology and catalog"
requires-python = ">=3.11,<3.13"
dependencies = [
    "loanops-common",
    "loanops-sse",
    "rdflib>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["packages/capability_kg"]

[tool.hatch.build.targets.wheel.force-include]
"packages/capability_kg" = "packages/capability_kg"
