[project]
name = "loanops-safety"
version = "0.1.0"
description = "LoanOps PII tokenize and content-safety middleware"
requires-python = ">=3.11,<3.13"
dependencies = [
    "loanops-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["packages/safety"]

[tool.hatch.build.targets.wheel.force-include]
"packages/safety" = "packages/safety"
