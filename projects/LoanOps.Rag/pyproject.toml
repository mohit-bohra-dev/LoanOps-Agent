[project]
name = "loanops-rag"
version = "0.1.0"
description = "LoanOps markdown chunker and SOP ingest"
requires-python = ">=3.11,<3.13"
dependencies = [
    "loanops-common",
    "markitdown>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["packages/rag"]

[tool.hatch.build.targets.wheel.force-include]
"packages/rag" = "packages/rag"
