[project]
name = "loanops-eval"
version = "0.1.0"
description = "LoanOps golden eval runner and metrics"
requires-python = ">=3.11,<3.13"
dependencies = [
    "loanops-common",
    "loanops-agent-core",
    "loanops-tools",
    "ragas==0.4.3",
    "numpy<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["packages/eval"]

[tool.hatch.build.targets.wheel.force-include]
"packages/eval" = "packages/eval"
