[project]
name = "loanops-tools"
version = "0.1.0"
description = "LoanOps tools composition (modular + MCP client factories)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "loanops-common",
    "loanops-sse",
    "loanops-docs",
    "loanops-db",
    "loanops-wiki",
    "loanops-eakg",
    "mcp>=1.27.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["packages/tools"]

[tool.hatch.build.targets.wheel.force-include]
"packages/tools" = "packages/tools"
