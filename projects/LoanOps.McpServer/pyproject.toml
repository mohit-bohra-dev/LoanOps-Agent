[project]
name = "loanops-mcp-server"
version = "0.1.0"
description = "LoanOps Streamable HTTP MCP server"
requires-python = ">=3.11,<3.13"
dependencies = [
    "loanops-common",
    "loanops-tools",
    "loanops-eakg",
    "loanops-capability-kg",
    "mcp>=1.27.1",
    "uvicorn[standard]==0.47.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["packages/mcp_server"]

[tool.hatch.build.targets.wheel.force-include]
"packages/mcp_server" = "packages/mcp_server"
