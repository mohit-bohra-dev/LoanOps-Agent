[project]
name = "loanops-sse"
version = "0.1.0"
description = "LoanOps OpenAPI catalog and live SSE invoke"
requires-python = ">=3.11,<3.13"
dependencies = [
    "loanops-common",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["packages/sse"]

[tool.hatch.build.targets.wheel.force-include]
"packages/sse" = "packages/sse"
