[project]
name = "loanops-agent-core"
version = "0.1.0"
description = "LoanOps agent turn loop, intent router, prompt loader"
requires-python = ">=3.11,<3.13"
dependencies = [
    "loanops-common",
    "loanops-safety",
    "agent-framework<1.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["packages/agent_core"]

[tool.hatch.build.targets.wheel.force-include]
"packages/agent_core" = "packages/agent_core"
