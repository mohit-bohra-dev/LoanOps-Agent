[project]
name = "loanops-eakg"
version = "0.1.0"
description = "LoanOps enterprise capability knowledge graph"
requires-python = ">=3.11,<3.13"
dependencies = [
    "loanops-common",
    "loanops-capability-kg",
    "rdflib>=7.0.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["packages/eakg"]

[tool.hatch.build.targets.wheel.force-include]
"packages/eakg" = "packages/eakg"
