[project]
name = "loanops-graphrag"
version = "0.1.0"
description = "LoanOps doc GraphRAG — community summary routing over DocsService"
requires-python = ">=3.11,<3.13"
dependencies = [
    "loanops-common",
    "loanops-docs",
    "networkx>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["packages/graph_rag"]

[tool.hatch.build.targets.wheel.force-include]
"packages/graph_rag" = "packages/graph_rag"
