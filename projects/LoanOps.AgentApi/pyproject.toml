[project]
name = "loanops-agent-api"
version = "0.1.0"
description = "LoanOps FastAPI Agent API (:8000)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "loanops-common",
    "loanops-agent-core",
    "loanops-tools",
    "loanops-safety",
    "loanops-sse",
    "fastapi==0.133.0",
    "uvicorn[standard]==0.47.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["apps/agent_api"]

[tool.hatch.build.targets.wheel.force-include]
"apps/agent_api" = "apps/agent_api"
