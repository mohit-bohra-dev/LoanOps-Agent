[project]
name = "loanops-docs"
version = "0.1.0"
description = "LoanOps docs vector search service"
requires-python = ">=3.11,<3.13"
dependencies = [
    "loanops-rag",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["packages/docs"]

[tool.hatch.build.targets.wheel.force-include]
"packages/docs" = "packages/docs"
