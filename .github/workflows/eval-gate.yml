name: eval-gate

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deterministic-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Sync
        run: uv sync
      - name: Layer 1 MCP
        run: uv run python -m packages.eval.mcp --report out/eval-mcp-l1.json
      - name: Layers 2-5
        run: |
          uv run python -m packages.eval.selection --report out/eval-l2.json
          uv run python -m packages.eval.arguments --report out/eval-l3.json
          uv run python -m packages.eval.trajectory --report out/eval-l4.json
          uv run python -m packages.eval.outcomes --report out/eval-l5.json
      - name: Layer 6 skeleton
        run: uv run python -m packages.eval.safety --report out/eval-l6.json
      - name: Retrieval stages
        run: uv run python -m packages.eval.retrieval --report out/eval-retrieval.json
      - name: Layer 9 validate
        run: uv run python -m packages.eval.governance validate
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: out/eval-*.json
