repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json
        exclude: ^apps/web_ui/tsconfig\.(app|node)\.json$
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy strict workspace projects
        entry: uv run mypy --strict projects
        language: system
        pass_filenames: false
      - id: project-refs
        name: check loanops ProjectReferences
        entry: uv run python scripts/check_project_refs.py
        language: system
        pass_filenames: false
        files: ^(projects/|scripts/check_project_refs\.py|pyproject\.toml)$
