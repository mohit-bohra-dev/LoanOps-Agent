[project]
name = "servicing-agent"
version = "0.1.0"
description = "Servicing Agent for Internal Care Reps — uv workspace solution"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "loanops-common",
    "loanops-safety",
    "loanops-db",
    "loanops-wiki",
    "loanops-rag",
    "loanops-docs",
    "loanops-sse",
    "loanops-capability-kg",
    "loanops-eakg",
    "loanops-tools",
    "loanops-agent-core",
    "loanops-mcp-server",
    "loanops-eval",
    "loanops-agent-api",
    "spacy<4",
    "opentelemetry-sdk==1.42.1",
    "click<8.1.8",
    "sentence-transformers==5.5.1",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0a2",
    "ruff==0.15.14",
    "mypy==2.1.0",
    "pre-commit==4.6.0",
]

[tool.ruff]
target-version = "py311"
line-length = 99
src = ["projects"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = [
    "projects/LoanOps.Common",
    "projects/LoanOps.Safety",
    "projects/LoanOps.Db",
    "projects/LoanOps.Wiki",
    "projects/LoanOps.Rag",
    "projects/LoanOps.Docs",
    "projects/LoanOps.Sse",
    "projects/LoanOps.CapabilityKg",
    "projects/LoanOps.Eakg",
    "projects/LoanOps.Tools",
    "projects/LoanOps.AgentCore",
    "projects/LoanOps.McpServer",
    "projects/LoanOps.Eval",
    "projects/LoanOps.AgentApi",
]
explicit_package_bases = true
namespace_packages = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["projects"]
pythonpath = [
    "projects/LoanOps.Common",
    "projects/LoanOps.Safety",
    "projects/LoanOps.Db",
    "projects/LoanOps.Wiki",
    "projects/LoanOps.Rag",
    "projects/LoanOps.Docs",
    "projects/LoanOps.Sse",
    "projects/LoanOps.CapabilityKg",
    "projects/LoanOps.Eakg",
    "projects/LoanOps.Tools",
    "projects/LoanOps.AgentCore",
    "projects/LoanOps.McpServer",
    "projects/LoanOps.Eval",
    "projects/LoanOps.AgentApi",
    ".",
]
addopts = ["--import-mode=importlib"]
markers = ["integration: requires live external services"]

[tool.uv]
prerelease = "allow"

[tool.uv.workspace]
members = ["projects/*"]

[tool.uv.sources]
provider-contracts = { path = "../provider_contracts", editable = true }
loanops-common = { workspace = true }
loanops-safety = { workspace = true }
loanops-db = { workspace = true }
loanops-wiki = { workspace = true }
loanops-rag = { workspace = true }
loanops-docs = { workspace = true }
loanops-sse = { workspace = true }
loanops-capability-kg = { workspace = true }
loanops-eakg = { workspace = true }
loanops-tools = { workspace = true }
loanops-agent-core = { workspace = true }
loanops-mcp-server = { workspace = true }
loanops-eval = { workspace = true }
loanops-agent-api = { workspace = true }
